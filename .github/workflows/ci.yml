name: "build and CI"
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: web/package.json
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Run lint
        run: pnpm run lint
      - name: Run test
        run: pnpm run test
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache-dependency-path: "go.sum"
      - name: Install dependencies
        run: go mod download
      - name: Build server
        run: go build ./...
      - name: Check server format
        run: |
          set -euo pipefail
          go list -f '{{.Dir}}' ./... > /tmp/server-go-package-dirs
          unformatted="$(xargs gofmt -l < /tmp/server-go-package-dirs)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - name: Vet server
        run: go vet ./...
      - name: Test server
        run: go test ./...
  batch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/cmd/batch
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup go
        uses: actions/setup-go@v6
        with:
          go-version-file: "server/cmd/batch/go.mod"
          cache-dependency-path: "server/cmd/batch/go.sum"
      - name: Install dependencies
        run: go mod download
      - name: Build batch
        run: go build -o /tmp/aws-log-practice-batch .
      - name: Check batch format
        run: |
          set -euo pipefail
          go list -f '{{.Dir}}' ./... > /tmp/batch-go-package-dirs
          unformatted="$(xargs gofmt -l < /tmp/batch-go-package-dirs)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - name: Vet batch
        run: go vet ./...
      - name: Test batch
        run: go test ./...
