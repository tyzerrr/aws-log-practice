name: build-and-push-batch-image.yml

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-and-push-batch-image.yml"
      - "server/cmd/batch/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: aws-log-practice-dev-ecr-repository

jobs:
  build-and-push-batch-image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        batch:
          - id: create-db-app-user
            context: server/cmd/batch
            dockerfile: server/cmd/batch/Dockerfile
            tag_prefix: batch-create-db-app-user
            title: aws-log-practice-batch-create-db-app-user
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get image tag
        id: get-image-tag
        run: |
          SHORT_COMMIT_ID=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date -u +%Y%m%d%H%M%S)
          IMAGE_TAG="${{ matrix.batch.tag_prefix }}-${SHORT_COMMIT_ID}-${TIMESTAMP}"
          echo "image-tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.IAM_ARN_TO_PUSH_CONTAINER_IMAGE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: "true"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push batch image to Amazon ECR
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.batch.context }}
          file: ${{ matrix.batch.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.get-image-tag.outputs.image-tag }}
          labels: |
            org.opencontainers.image.title=${{ matrix.batch.title }}
            org.opencontainers.image.description=ECS one-shot batch image for ${{ matrix.batch.id }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            com.aws-log-practice.image.kind=batch
            com.aws-log-practice.batch.name=${{ matrix.batch.id }}

      - name: Write image summary
        run: |
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.get-image-tag.outputs.image-tag }}"
          echo "### Pushed batch image" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Batch: \`${{ matrix.batch.id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${IMAGE_URI}\`" >> "$GITHUB_STEP_SUMMARY"
